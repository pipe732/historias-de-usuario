<div class="d-flex align-items-center justify-content-between mb-4">
  <div>
    <h5 class="extracted-style-132"
    >
      {{ titulo }}
    </h5>
    {% if subtitulo %}
    <p class="extracted-style-133"
    >
      {{ subtitulo }}
    </p>
    {% endif %}
  </div>

  {% if url_accion %}
  <a href="{{ url_accion }}" class="btn-primary-mine">
    <svg
      width="13"
      height="13"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="16" />
      <line x1="8" y1="12" x2="16" y2="12" />
    </svg>
    {{ label_accion }}
  </a>
  {% elif url_cancelar %}
  <a href="{{ url_cancelar }}" class="btn-outline-mine">Cancelar</a>
  {% endif %}
</div>
