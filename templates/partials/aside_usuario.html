<aside>
  <div class="aside-header">
    <i class="bi bi-cloud-haze2-fill extracted-style-353"></i>
    <span class="aside-brand-name">Mine</span>
    <span class="aside-brand-sub">inventory</span>
  </div>

  <nav class="aside-nav">

    <!-- GENERAL -->
    <div class="d-flex align-items-center gap-2 px-3 pt-3 pb-1">
      <span class="text-uppercase fw-semibold extracted-style-361">
        General
      </span>
      <hr class="flex-grow-1 my-0 opacity-10" />
    </div>

    <!-- Principal → Mis Préstamos (es la página principal del usuario) -->
    <a href="{% url 'home_usuario' %}"
      class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded mx-2 fw-medium
              {% if request.resolver_match.url_name == 'home_usuario' %}active{% else %}text-white-50{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
      </svg>
      Principal
    </a>

    <!-- Mis Préstamos -->
    <a href="{% url 'prestamo_usuario' %}"
      class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded mx-2 fw-medium
              {% if request.resolver_match.url_name == 'prestamo_usuario' %}active{% else %}text-white-50{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="9 10 4 15 9 20" />
        <path d="M20 4v7a4 4 0 0 1-4 4H4" />
      </svg>
      Mis Préstamos
    </a>

    <!-- SESIÓN — solo visible si NO hay sesión activa -->
    {% if not request.session.usuario_nombre %}
    <div class="d-flex align-items-center gap-2 px-3 pt-3 pb-1">
      <span class="text-uppercase fw-semibold extracted-style-361">
        Sesión
      </span>
      <hr class="flex-grow-1 my-0 opacity-10" />
    </div>

    <a href="{% url 'login' %}"
      class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded mx-2 fw-medium
              {% if request.resolver_match.url_name == 'login' %}active{% else %}text-white-50{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
        <polyline points="10 17 15 12 10 7" />
        <line x1="15" y1="12" x2="3" y2="12" />
      </svg>
      Inicio de sesión
    </a>
    {% endif %}

  </nav>

  <!-- ── Usuario + logout al fondo ── -->
  <div class="nav-bottom">
    <hr class="opacity-10 mx-3 my-0">
    <div class="aside-user-bottom-row">
      <!-- Bell notification button -->
      <div id="aside-notif-widget" class="aside_admin__style-2">
        <button id="aside-notif-btn" type="button" aria-label="Notificaciones" aria-expanded="false" class="aside-user-notif-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span id="aside-notif-badge" class="aside-user-notif-badge">0</span>
        </button>
        <!-- Notif panel + JS -->
        {% include "partials/_notif_row.html" %}
      </div>

      <!-- Circular user avatar dropup -->
      <div class="dropup aside-user-dropup-container">
        <button type="button" class="btn w-100 d-flex align-items-center gap-2 px-2 py-1.5 dropdown-toggle aside-user-dropup-btn"
          data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
          {% with nombre=request.session.usuario_nombre|default:"Invitado" %}
          <div class="d-flex align-items-center justify-content-center rounded-circle bg-danger flex-shrink-0 fw-bold text-white aside-user-avatar">
            {{ nombre|slice:":2"|upper }}
          </div>
          {% with partes=nombre.split %}
          <span class="flex-grow-1 text-start text-truncate">{{ partes.0 }}</span>
          {% endwith %}
          {% endwith %}
        </button>

        <ul class="dropdown-menu dropdown-menu-end shadow aside-user-dropdown-menu">
          <li>
            <span class="dropdown-item-text small text-white-50">
              <i class="bi bi-shield-check me-1"></i>
              {{ request.session.usuario_rol|default:"Sin rol" }}
            </span>
          </li>
          <li><hr class="dropdown-divider border-white-subtle"></li>
          <li>
            <a class="dropdown-item d-flex align-items-center gap-2 text-white-75" href="{% url 'perfil' %}">
              <i class="bi bi-person"></i> Mi perfil
            </a>
          </li>
          <li>
            <a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="{% url 'logout' %}">
              <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </a>
          </li>
        </ul>
      </div><!-- /dropup -->

    </div>
  </div><!-- /nav-bottom -->
</aside>
