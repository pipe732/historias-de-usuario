{# templates/partials/_notif_row.html — panel de notificaciones del aside (sin botón) #}

<div id="aside-notif-panel" class="aside-notif-panel d-none">
  <div class="aside-notif-panel-header">
    <div class="d-flex align-items-center gap-2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--cream)" stroke-width="1.8" opacity=".8">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span class="aside-notif-panel-title">Notificaciones</span>
      <span id="aside-panel-count" class="aside-panel-count d-none">0</span>
    </div>
    <button id="aside-notif-close" type="button" aria-label="Cerrar notificaciones" class="aside-notif-close">✕</button>
  </div>

  <div id="aside-notif-list" class="aside-notif-list"></div>

  <div id="aside-notif-loading" class="aside-notif-loading text-center">
    <div class="d-inline-flex gap-1 align-items-center mb-1">
      <span class="notif-dot-anim"></span>
      <span class="notif-dot-anim notif_row__style-1"></span>
      <span class="notif-dot-anim notif_row__style-2"></span>
    </div>
    <div>Cargando…</div>
  </div>

  <div id="aside-notif-empty" class="aside-notif-empty d-none text-center">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--rust)" stroke-width="1.2" class="d-block mx-auto mb-2">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <p class="aside-notif-empty-title">Sin notificaciones</p>
    <p class="aside-notif-empty-desc">Todo está en orden</p>
  </div>

  <div class="aside-notif-panel-footer">
    <span id="aside-notif-ts" class="aside-notif-ts">—</span>
    <button id="aside-notif-refresh" type="button" aria-label="Actualizar notificaciones" class="aside-notif-refresh">
      <svg id="aside-refresh-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="1 4 1 10 7 10" />
        <path d="M3.51 15a9 9 0 1 0 .49-3.51" />
      </svg>
      Actualizar
    </button>
  </div>
</div>

<style>
  .aside-notif-panel { position: fixed; bottom: 5.5rem; left: calc(var(--aside-w) + .5rem); width: 320px; max-height: min(480px, calc(100vh - 8rem)); background: #fff; border: 1px solid rgba(27,32,33,.14); border-radius: var(--radius-lg); box-shadow: 0 8px 32px rgba(27,32,33,.18); z-index: 99995; overflow: hidden; flex-direction: column; }
  .aside-notif-panel-header { padding: .72rem 1rem; background: #094D92; border-bottom: 2px solid var(--rust); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .aside-notif-panel-title { font-family: var(--font-ui); font-weight: 700; font-size: .85rem; color: #EFECCA; letter-spacing: .04em; }
  .aside-panel-count { font-family: var(--font-mono); font-size: .65rem; background: rgba(152,71,62,.3); color: #EFECCA; padding: .1rem .45rem; border-radius: 20px; margin-left: .25rem; }
  .aside-notif-close { background: none; border: none; cursor: pointer; color: rgba(239,236,202,.6); padding: 0; line-height: 1; font-size: 1.1rem; transition: color .15s; }
  .aside-notif-close:hover { color: #fff; }
  .aside-notif-list { flex: 1; overflow-y: auto; padding: .5rem .6rem; max-height: 380px; scrollbar-width: thin; scrollbar-color: rgba(9,77,146,.2) transparent; }
  .aside-notif-loading { padding: 2rem; color: #71816D; font-family: var(--font-ui); font-size: .82rem; }
  .aside-notif-empty { padding: 2.5rem 1rem; }
  .aside-notif-empty-title { font-family: var(--font-ui); color: #1B2021; font-size: .82rem; font-weight: 600; margin: 0 0 .2rem; }
  .aside-notif-empty-desc { font-family: var(--font-ui); color: #71816D; font-size: .72rem; margin: 0; opacity: .7; }
  .aside-notif-panel-footer { padding: .5rem .9rem; border-top: 1px solid rgba(27,32,33,.1); background: #f8f7f2; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .aside-notif-ts { font-family: var(--font-mono); font-size: .62rem; color: #71816D; }
  .aside-notif-refresh { background: none; border: none; cursor: pointer; color: #71816D; font-family: var(--font-ui); font-size: .72rem; font-weight: 600; padding: 0; display: flex; align-items: center; gap: .3rem; transition: color .15s; }
  .aside-notif-refresh:hover { color: #094D92; }
  .notif-dot-anim {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background-color: var(--text-muted);
    animation: notifBlink 1.4s infinite both;
  }
  @keyframes notifBlink {
    0% { opacity: .2; }
    20% { opacity: 1; }
    100% { opacity: .2; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .aside-notif-row {
    display: flex;
    align-items: flex-start;
    gap: .65rem;
    padding: .65rem .75rem;
    border-radius: var(--radius-sm);
    text-decoration: none;
    transition: background .15s;
    margin-bottom: 4px;
  }
  .aside-notif-row:hover {
    background: rgba(27,32,33,.04);
  }
  .aside-notif-row-icon {
    font-size: 1.15rem;
    margin-top: 2px;
    line-height: 1;
  }
  .aside-notif-row-body {
    flex: 1;
    min-width: 0;
    line-height: 1.2;
  }
  .aside-notif-row-title {
    font-family: var(--font-ui);
    font-size: .82rem;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .aside-notif-row-desc {
    font-family: var(--font-ui);
    font-size: .72rem;
    color: var(--text-muted);
    margin-top: 2px;
  }
  @keyframes bell-ring {
    0%, 100% { transform: rotate(0); }
    20%, 60% { transform: rotate(-15deg); }
    40%, 80% { transform: rotate(15deg); }
  }
  @keyframes badge-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .bell-ring-anim { animation: bell-ring .6s ease-in-out; }
  .badge-pulse-anim { animation: badge-pulse .6s ease-in-out; }
</style>

<script>
  window.localNotifications = window.localNotifications || [];

  window.addNotification = function(title, desc, icon, color) {
    window.localNotifications.unshift({
      titulo: title,
      desc: desc,
      icono: icon || 'info-circle',
      color: color || 'var(--navy)'
    });
    
    var notifBtn = document.getElementById('aside-notif-btn');
    var bellBadge = document.getElementById('aside-notif-badge');
    
    if(notifBtn) {
       notifBtn.classList.add('bell-ring-anim');
       setTimeout(function() { notifBtn.classList.remove('bell-ring-anim'); }, 1500);
       
       var badge = document.getElementById('aside-notif-badge');
       if (badge) {
         var current = parseInt(badge.textContent) || 0;
         badge.textContent = current + 1;
         badge.style.display = 'inline-flex';
       }
    }
    
    if (window._loadNotifications) window._loadNotifications();
  };

  /* Override global alert */
  var originalAlert = window.alert;
  window.alert = function(msg) {
    window.addNotification('Alerta del sistema', msg, 'exclamation-triangle-fill', '#ef4444');
  };

  document.addEventListener('DOMContentLoaded', function () {
    var notifBtn = document.getElementById('aside-notif-btn');
    var notifPanel = document.getElementById('aside-notif-panel');
    var notifClose = document.getElementById('aside-notif-close');
    var notifRefresh = document.getElementById('aside-notif-refresh');
    var refreshIcon = document.getElementById('aside-refresh-icon');

    function toggleNotifPanel(forceOpen) {
      if (!notifPanel || !notifBtn) return;
      var isHidden = notifPanel.classList.contains('d-none');
      if (isHidden || forceOpen === true) {
        notifPanel.classList.remove('d-none');
        notifPanel.classList.add('d-flex');
        notifBtn.setAttribute('aria-expanded', 'true');
        loadNotifications();
      } else if (!forceOpen) {
        closeNotifPanel();
      }
    }
    window._toggleNotifPanel = toggleNotifPanel;

    function closeNotifPanel() {
      if (!notifPanel || !notifBtn) return;
      notifPanel.classList.remove('d-flex');
      notifPanel.classList.add('d-none');
      notifBtn.setAttribute('aria-expanded', 'false');
    }

    function loadNotifications() {
      var loading = document.getElementById('aside-notif-loading');
      var empty = document.getElementById('aside-notif-empty');
      var list = document.getElementById('aside-notif-list');
      var countBadge = document.getElementById('aside-panel-count');
      var bellBadge = document.getElementById('aside-notif-badge');
      var ts = document.getElementById('aside-notif-ts');

      if (!list || !loading || !empty) return;

      loading.classList.remove('d-none');
      empty.classList.add('d-none');
      list.innerHTML = '';
      if (refreshIcon) refreshIcon.style.animation = 'spin 1s linear infinite';

      fetch('/notificaciones/')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          loading.classList.add('d-none');
          if (refreshIcon) refreshIcon.style.animation = '';

          var serverItems = data.items || [];
          var allItems = window.localNotifications.concat(serverItems);
          var total = allItems.length;

          if (total > 0) {
            if (bellBadge) {
              bellBadge.textContent = total;
              bellBadge.style.display = 'inline-flex';
            }
            if (countBadge) {
              countBadge.textContent = total;
              countBadge.classList.remove('d-none');
            }
          } else {
            if (bellBadge) bellBadge.style.display = 'none';
            if (countBadge) countBadge.classList.add('d-none');
          }

          var now = new Date();
          if (ts) ts.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          if (total > 0) {
            empty.classList.add('d-none');
            allItems.forEach(function (item) {
              var row = document.createElement('a');
              row.href = item.url || '#';
              row.className = 'aside-notif-row';

              var svgIcon = '';
              if (item.icono === 'exclamation-octagon-fill' || item.icono === 'error') {
                 svgIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>';
              } else if (item.icono === 'exclamation-triangle-fill' || item.icono === 'warning') {
                 svgIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
              } else {
                 svgIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>';
              }

              row.innerHTML =
                '<div class="flex-shrink-0 aside-notif-row-icon" style="color: ' + (item.color || 'var(--navy)') + ' !important;">' + svgIcon + '</div>' +
                '<div class="aside-notif-row-body">' +
                  '<div class="aside-notif-row-title">' + escapeHtml(item.titulo) + '</div>' +
                  '<div class="aside-notif-row-desc">' + escapeHtml(item.desc) + '</div>' +
                '</div>';

              list.appendChild(row);
            });
          } else {
            empty.classList.remove('d-none');
          }
        })
        .catch(function (err) {
          console.error("Error loading notifications:", err);
          loading.classList.add('d-none');
          
          /* Mostrar al menos las locales si falló la red */
          if (window.localNotifications.length > 0) {
            window.localNotifications.forEach(function (item) {
              var row = document.createElement('a');
              row.href = item.url || '#';
              row.className = 'aside-notif-row';
              var svgIcon = '';
              if (item.icono === 'exclamation-octagon-fill' || item.icono === 'error') {
                 svgIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>';
              } else if (item.icono === 'exclamation-triangle-fill' || item.icono === 'warning') {
                 svgIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
              } else {
                 svgIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>';
              }

              row.innerHTML =
                '<div class="flex-shrink-0 aside-notif-row-icon" style="color: ' + (item.color || 'var(--navy)') + ' !important;">' + svgIcon + '</div>' +
                '<div class="aside-notif-row-body">' +
                  '<div class="aside-notif-row-title">' + escapeHtml(item.titulo) + '</div>' +
                  '<div class="aside-notif-row-desc">' + escapeHtml(item.desc) + '</div>' +
                '</div>';
              list.appendChild(row);
            });
          } else {
            empty.classList.remove('d-none');
          }
          if (refreshIcon) refreshIcon.style.animation = '';
        });
    }
    window._loadNotifications = loadNotifications;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Bind events
    if (notifBtn) notifBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleNotifPanel();
    });
    if (notifClose) notifClose.addEventListener('click', function (e) {
      e.stopPropagation();
      closeNotifPanel();
    });
    if (notifRefresh) notifRefresh.addEventListener('click', function (e) {
      e.stopPropagation();
      loadNotifications();
    });
    if (notifPanel) notifPanel.addEventListener('click', function (e) {
      e.stopPropagation();
    });

    document.addEventListener('click', function () {
      closeNotifPanel();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeNotifPanel();
    });

    /* Scrape global Django messages and push them locally */
    document.querySelectorAll('.alert-dismissible, .scrape-notif').forEach(function(alertEl) {
      // First try to find a span which usually contains the message
      var span = alertEl.querySelector('span:not(.btn-close):not([aria-hidden])');
      var text = span ? span.textContent.trim() : '';

      if (!text || text.length < 2) {
        // Fallback to direct text nodes
        text = Array.from(alertEl.childNodes)
          .filter(node => node.nodeType === 3)
          .map(node => node.textContent.trim())
          .join(' ');
      }
      
      if (!text || text.length < 2) {
         // Final fallback if structured differently
         text = alertEl.textContent.replace(/Cerrar|×/gi, '').trim().replace(/\s+/g, ' ');
      }

      if (text) {
        var isError = alertEl.classList.contains('alert-danger') || alertEl.classList.contains('error');
        var isWarning = alertEl.classList.contains('warning-notif');
        
        var title = isError ? 'Aviso del sistema' : (isWarning ? 'Acción requerida' : 'Operación exitosa');
        var icon = isError ? 'exclamation-octagon-fill' : (isWarning ? 'exclamation-triangle-fill' : 'check-circle-fill');
        var color = isError ? '#ef4444' : (isWarning ? '#c4900a' : '#22c55e');

        window.addNotification(title, text, icon, color);
        // Completely remove original alert from DOM to defeat !important CSS classes (like .d-flex)
        alertEl.remove();
      }
    });

    // Initial load for badge count
    loadNotifications();
  });
</script>
